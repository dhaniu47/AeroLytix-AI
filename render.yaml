databases:
  - name: aerolytix-db
    plan: free
    databaseName: aerolytix
    user: aerolytix

services:
  - type: web
    name: aerolytix-ai
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: cd django_backend && gunicorn django_backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aerolytix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.5"
